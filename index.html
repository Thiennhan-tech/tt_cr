<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💕 I love you! 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #fff0f5 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #ffd6e0 0%, transparent 35%),
                linear-gradient(135deg, #ffe5ec, #ffc2d1);

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            overflow: hidden;
            text-align: center;
            position: relative;
        }

        

        .sparkle {
            position: fixed;
            color: white;
            pointer-events: none;
            animation: sparkleAnimation 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes sparkleAnimation {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.2) rotate(180deg);
            }
        }

        

        .container {
            position: relative;
            z-index: 10;

            background: rgba(255, 255, 255, 0.88);

            padding: 35px 28px;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(255, 77, 109, 0.25),
                0 0 0 2px rgba(255, 255, 255, 0.6);

            backdrop-filter: blur(15px);

            max-width: 450px;
            width: 90%;

            transition: all 0.5s ease;

            animation: cardAppear 1s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        
        .gif-wrapper {
            position: relative;

            display: inline-block;

            margin-bottom: 20px;

            animation: cuteFloat 3s ease-in-out infinite;
        }

        .gif {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 25px;

            box-shadow:
                0 10px 25px rgba(255, 77, 109, 0.25);

            border: 5px solid white;
        }

        .gif-heart {
            position: absolute;
            font-size: 30px;

            animation: heartFloat 2s ease-in-out infinite;
        }

        .gif-heart:nth-child(2) {
            top: -15px;
            right: -15px;
        }

        .gif-heart:nth-child(3) {
            bottom: 5px;
            left: -20px;
            animation-delay: 0.5s;
        }

        @keyframes cuteFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes heartFloat {
            0%, 100% {
                transform: translateY(0) rotate(-10deg);
            }

            50% {
                transform: translateY(-10px) rotate(10deg);
            }
        }

        

        h1 {
            color: #ff4d6d;

            font-size: 2rem;

            margin-bottom: 18px;

            line-height: 1.3;

            text-shadow:
                0 3px 10px rgba(255, 77, 109, 0.15);
        }

        p {
            color: #555;

            font-size: 1.05rem;

            line-height: 1.7;

            margin-bottom: 28px;
        }

    

        .btn-group {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            position: relative;

            height: 60px;
        }

        button {
            padding: 13px 25px;

            font-size: 1rem;

            font-weight: bold;

            border: none;

            border-radius: 30px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #btnYes {
            background: linear-gradient(
                135deg,
                #ff4d6d,
                #ff758f
            );

            color: white;

            box-shadow:
                0 8px 20px rgba(255, 77, 109, 0.3);
        }

        #btnYes:hover {
            transform: scale(1.08);

            box-shadow:
                0 10px 25px rgba(255, 77, 109, 0.4);
        }

        #btnNo {
            background: #6c757d;

            color: white;

            position: absolute;

            left: 58%;
        }

    

        .heart {
            position: fixed;

            top: -50px;

            color: #ff4d6d;

            pointer-events: none;

            z-index: 2;

            animation:
                heartFall linear forwards;

            text-shadow:
                0 0 10px rgba(255, 77, 109, 0.4);
        }

        @keyframes heartFall {

            0% {
                transform:
                    translateY(-50px)
                    rotate(0deg)
                    scale(0.5);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(50vh)
                    rotate(180deg)
                    scale(1);
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg)
                    scale(1.3);

                opacity: 0;
            }
        }

        

        .love-heart {
            position: fixed;

            bottom: -50px;

            pointer-events: none;

            z-index: 20;

            animation: loveFly 4s ease-out forwards;
        }

        @keyframes loveFly {

            0% {
                transform:
                    translateY(0)
                    scale(0.5)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.8)
                    rotate(360deg);

                opacity: 0;
            }
        }

        

        @media (max-width: 500px) {

            .container {
                padding: 28px 20px;
            }

            .gif {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 1.6rem;
            }

            p {
                font-size: 0.95rem;
            }

            button {
                padding: 12px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    

    <div class="container" id="card">

        <!-- GIF dễ thương -->
        <div class="gif-wrapper">

            <img
                class="gif"
                src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3R4aDByM3Z3Z2N5eW9tNmY5c3l0Z2t5c2N5a3l5a3R2a3R5dCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MDJ9IbxxvDUQM/giphy.gif"
                alt="Cute Cat GIF"
            >

            <span class="gif-heart">💗</span>
            <span class="gif-heart">💕</span>

        </div>

        <h1 id="title">
            Em làm ghệ a nha? ❤️
        </h1>

        <p id="message">
            Phút đầu gặp em là anh đã hiểu thế nào là tình yêu sét đánh,
            và đã rơi vào lưới tình của em.
            Anh chỉ mong em sẽ đáp lại tình cảm của anh,
            em nguyện ý làm bạn gái anh nha!!! 🥺❤️
        </p>

        <div class="btn-group">

            <button id="btnYes">
                Dạ cóa! ăm chã húi 🥰
            </button>

            <button id="btnNo">
                Không cóa đâu 😜
            </button>

        </div>

    </div>

    <script>

        const btnYes = document.getElementById("btnYes");
        const btnNo = document.getElementById("btnNo");

        const title = document.getElementById("title");
        const message = document.getElementById("message");

        

        function moveNoButton() {

            const padding = 20;

            const maxX =
                window.innerWidth -
                btnNo.offsetWidth -
                padding;

            const maxY =
                window.innerHeight -
                btnNo.offsetHeight -
                padding;

            const x =
                Math.random() *
                Math.max(maxX, padding);

            const y =
                Math.random() *
                Math.max(maxY, padding);

            btnNo.style.position = "fixed";

            btnNo.style.left = `${x}px`;

            btnNo.style.top = `${y}px`;
        }

        btnNo.addEventListener(
            "mouseenter",
            moveNoButton
        );

        btnNo.addEventListener(
            "touchstart",
            moveNoButton
        );

        btnNo.addEventListener(
            "click",
            moveNoButton
        );

        

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            const hearts = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💘",
                "💝"
            ];

            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() * hearts.length
                    )
                ];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                Math.random() * 25 + 15 + "px";

            heart.style.animationDuration =
                Math.random() * 3 + 3 + "s";

            heart.style.opacity =
                Math.random() * 0.5 + 0.5;

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        
        setInterval(createHeart, 350);

        

        function createSparkle() {

            const sparkle =
                document.createElement("div");

            sparkle.className = "sparkle";

            sparkle.innerHTML = "✨";

            sparkle.style.left =
                Math.random() * 100 + "vw";

            sparkle.style.top =
                Math.random() * 100 + "vh";

            sparkle.style.fontSize =
                Math.random() * 15 + 10 + "px";

            sparkle.style.animationDuration =
                Math.random() * 2 + 1.5 + "s";

            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 3500);
        }

        setInterval(createSparkle, 500);

        

        function createLoveHeart() {

            const heart =
                document.createElement("div");

            heart.className = "love-heart";

            heart.innerHTML = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "🥰"
            ][
                Math.floor(Math.random() * 6)
            ];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                Math.random() * 35 + 20 + "px";

            heart.style.animationDuration =
                Math.random() * 2 + 3 + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

       
        btnYes.addEventListener("click", () => {

            title.innerHTML =
                "Oke! Người đtrai như Thiện Nhân đây chính thức có ghệ ròi nha 😘❤️";

            message.innerHTML =
                "Thiện Nhân sẽ iu em bằng cả tấm lòng, " +
                "vậy nên xin em đừng bỏ rơi ng đtrai này nha 😘🥰😍🤩!";
            btnYes.style.display = "none";
            btnNo.style.display = "none";
            setInterval(createLoveHeart, 100);
            document.body.style.background =
                "linear-gradient(135deg, #ff9a9e, #fad0c4, #ffccd5)";
            const card =
                document.getElementById("card");

            card.style.transform =
                "scale(1.05)";

        });

    </script>

</body>
</html>
