<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực sự là toi lỡ yeu cậu mất roi</title>
    <style>
        /* Định dạng cơ bản cho toàn bộ trang */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Khung chứa nội dung chính */
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .gif {
            width: 150px;
            margin-bottom: 20px;
        }

        /* Khu vực chứa nút bấm */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
        }

        #btnYes {
            background-color: #ff4d6d;
            color: white;
        }

        #btnYes:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }

        #btnNo {
            background-color: #6c757d;
            color: white;
            position: absolute;
            left: 55%;
        }

        /* Hiệu ứng bong bóng trái tim bay lên */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            animation: fly Up 3s linear forwards;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        
        <img class="gif" src="https://giphy.com" alt="Cute Cat">
        <h1 id="title">Em làm ghệ a nha? ❤️</h1>
        <p id="message">Phút đầu gặp em là anh đã hiểu thế nào là tình yêu sét đánh,
        và đã rơi vào lưới tình của em, anh chỉ mong em sẽ đáp lại tình cảm của anh,
        em nguyện ý làm bạn gái anh nha!!!</p>
        
        
        <div class="btn-group">
            <button id="btnYes">Dạ cóa! ăm chã húi 🥰</button>
            <button id="btnNo">Không cóa đâu 😜</button>
        </div>
    </div>

    <script>
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const card = document.getElementById('card');

        
        function moveNoButton() {
            // Giới hạn vùng nút có thể nhảy (tránh nhảy ra ngoài màn hình)
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('click', moveNoButton);

        
        btnYes.addEventListener('click', () => {
            // Thay đổi nội dung hiển thị
            title.innerHTML = "Oke!Người đtrai như Thiện Nhân đây chính thức có ghệ ròi nha 😘";
            message.innerHTML = "Thiện Nhân sẽ iu em bằng cả tấm lòng, vậy nên xin em đừng bỏ rơi ng đtrai này nha 😘🥰😍 🤩!";
            btnYes.style.display = 'none';
            btnNo.style.display = 'none';
            
            // Kích hoạt hiệu ứng mưa tim
            setInterval(createHeart, 150);
        });
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's'; // từ 2s đến 4s
            heart.style.fontSize = Math.random() * 20 + 15 + 'px'; // từ 15px đến 35px
            
            document.body.appendChild(heart);

            // Xóa tim sau khi bay xong để tránh nặng máy
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
    </script>
</body>
</html>
        }
    </script>
</body>
</html>
